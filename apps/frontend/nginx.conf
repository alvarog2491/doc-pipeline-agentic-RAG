server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the api service on every request instead of caching the IP for the life of
    # the worker process (Docker recreates the container with a new IP on restart).
    resolver 127.0.0.11 valid=10s;

    # REST + Server-Sent Events. Buffering is off so every SSE event reaches the browser the
    # moment the API emits it; the long read timeout covers slow guide generation.
    location /v1/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        chunked_transfer_encoding on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
